description: >-
  Carter's, Inc. (NYSE: CRI) is the largest branded marketer of young children's apparel in the
  United States, selling the Carter's, OshKosh B'gosh, Skip Hop and Little Planet brands through its
  own stores, carters.com and wholesale partners. It is a physical-goods retailer, not a software
  company, and publishes no developer program: developer.carters.com has no DNS record,
  www.carters.com/developers is a 404, and api.carters.com — the storefront's backend host — hard-403s
  every request. Its only external programs are a CJ affiliate program and privately negotiated EDI
  trading-partner guidelines. No OpenAPI, AsyncAPI, GraphQL SDL, MCP server, A2A agent card, SDK or
  package exists, and none has been authored on its behalf; the placeholder "Carter's API" entry that
  once stood here has been removed. What it does publish is recorded: a privacy policy with a Global
  Privacy Control commitment and a OneTrust data-subject request portal, terms, customer service, and
  its IR newsroom.
